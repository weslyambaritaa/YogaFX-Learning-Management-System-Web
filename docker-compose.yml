version: "3.9"

services:
    app:
        build:
            context: .
            dockerfile: Dockerfile
        restart: unless-stopped
        ports:
            - "8000:8000"
        env_file:
            - .env
        depends_on:
            - postgres

    postgres:
        image: postgres:17
        restart: unless-stopped
        environment:
            POSTGRES_DB: yogafx_lms
            POSTGRES_USER: postgres
            POSTGRES_PASSWORD: postgres
        ports:
            - "5432:5432"
        volumes:
            - postgres_data:/var/lib/postgresql/data

volumes:
    postgres_data:
